# Render Blueprint — 予約導線つきAI診断LPビルダー
# Render ダッシュボードで「New +」→「Blueprint」→ このリポジトリを選ぶと
# 下記の設定で自動デプロイされます。
services:
  - type: web
    name: ai-diagnosis
    runtime: python
    plan: starter
    # 依存パッケージなし（標準ライブラリのみ）。requirements.txt は空でOK。
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # データ保存先を永続ディスクに向ける（再デプロイ・再起動でも消えない）
      - key: DATA_DIR
        value: /var/data
    # 永続ディスク：回答データ・作成した診断を永続化
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
